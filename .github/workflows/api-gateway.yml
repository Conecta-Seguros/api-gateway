name: Api Gateway CI/CD

on:
  push:
    branches:
      - develop
      - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '25'
  GRADLE_VERSION: '9.1.0'

jobs:
  # ============================================
  # JOB 1: Build
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6.0.3

      - name: ☕ Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔧 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🏗️ Build JAR
        run: ./gradlew bootJar --no-daemon --stacktrace -x test
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: 📦 Upload JAR artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: api-gateway-jar
          path: build/libs/*.jar
          retention-days: 1
          if-no-files-found: error

  # ============================================
  # JOB 2: Security Scan
  # ============================================
  security-scan:
    name: Security Scan
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6.0.3

      - name: 🔐 Run Trivy vulnerability scanner (code)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: 0

  # ============================================
  # JOB 3: Build and Push Docker Image
  # ============================================
  build-docker:
    name: Build & Push Docker Image
    needs: [build, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6.0.3

      - name: 🔤 Convert repository name to lowercase
        id: repo_name
        run: |
          echo "repository_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.repository_lower }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 🏗️ Build and push Docker image
        id: build
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            JAVA_VERSION=${{ env.JAVA_VERSION }}
            APP_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.title=Api Gateway
            org.opencontainers.image.description=Api Gateway for Conecta Seguros
            org.opencontainers.image.vendor=Conecta Seguros
            java.version=${{ env.JAVA_VERSION }}
            gradle.version=${{ env.GRADLE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: false

      - name: 🔍 Debug - Show pushed tags
        run: |
          echo "Tags that should be pushed:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: 📋 Image digest
        run: echo "Image digest:- ${{ steps.build.outputs.digest }}"

      - name: 📋 Success
        run: |
          echo "✅ Image built successfully"
          echo "🏷️ Image: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.repository_lower }}:latest"

  # ============================================
  # JOB 4: Deploy to Production
  # ============================================
  deploy-to-vps:
    name: Deploy to Production
    needs: build-docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    environment:
      name: production

    steps:
      - name: 🔤 Convert repository name to lowercase
        id: repo_name
        run: |
          echo "repository_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: 📥 Checkout code
        uses: actions/checkout@v6.0.3

      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            
            echo "🔐 Login to GHCR with PAT..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "📥 Pulling latest Api Gateway image..."
            docker pull ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.repository_lower }}:latest
            
            echo "🔄 Navigating to deployment directory..."
            cd /opt/conecta-seguros-backend || { echo "❌ Directory not found"; exit 1; }
            
            echo "🛑 Stop and remove containers..."
            docker compose -p gateway --env-file .env-gateway -f docker-compose-gateway.yml down
            
            echo "🚀 Start Api Gateway cluster..."
            docker compose -p gateway --env-file .env-gateway -f docker-compose-gateway.yml up -d
            
            echo "⏳ Waiting for services to be healthy..."
            sleep 10
            
            echo "🏥 Health Checks..."
            HEALTH_CHECK_PASSED=false
            
            if docker exec conecta-api-gateway wget -q --spider http://localhost:8080/actuator/health 2>/dev/null; then
              echo "✅ Gateway is healthy!"
              HEALTH_CHECK_PASSED=true
            else
              echo "⚠️ Gateway health check failed"
              docker logs conecta-api-gateway --tail 30
            fi
            
            echo "📊 Cluster Status:"
            docker ps --filter name=conecta-api-gateway
            
            echo "🔍 Registered Services:"
            docker exec conecta-api-gateway wget -qO- http://localhost:8080/actuator/health 2>/dev/null | grep -o '<name>.*</name>' | head -5 || echo "No services registered yet"
            
            echo "🧹 Cleaning up old images..."
            docker image prune -af --filter "until=24h" || true
            
            if [ "$HEALTH_CHECK_PASSED" = true ]; then
              echo ""
              echo "✅ Api Gateway deployed successfully!"
            else
              echo ""
              echo "⚠️ Deployment completed with warnings - check logs above"
            fi

      - name: 🏥 Verify deployment health
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "🔍 Checking Gateway health..."
            for i in {1..30}; do
              if docker exec conecta-api-gateway wget --spider -q http://localhost:8080/actuator/health 2>/dev/null; then
                echo "✅ Gateway is healthy!"
                break
              fi
              echo "⏳ Attempt $i/30: Waiting for Gateway..."
              sleep 2
            done
            
            echo "📊 Deployment Status:"
            docker ps --filter name=conecta-api-gateway

      - name: 📢 Deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Api Gateway deployed successfully to production!"
            echo "🌐 Access Gateway Dashboard at: http://${{ secrets.VPS_HOST }}:8761"
          else
            echo "❌ Api Gateway deployment failed!"
          fi