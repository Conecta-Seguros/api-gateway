# ============================================
#        TEST PROFILE NO EXTERNAL SERVICES
# ============================================

spring.application.name=api-gateway
spring.main.web-application-type=reactive

# Disable service discovery
spring.cloud.discovery.enabled=false
eureka.client.enabled=false

# Disable gateway routing engine (not needed for unit/slice tests)
spring.cloud.gateway.enabled=false

# Disable OAuth2 resource server JWT auto-configuration (mocked in tests)
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=

# Redis not available in test
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Suppress noisy logs
logging.level.root=WARN
logging.level.conectaseguros.co.api.gateway=DEBUG
