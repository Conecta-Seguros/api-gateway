# ============================================
#        API GATEWAY — BASE CONFIGURATION
# ============================================
# Shared settings across ALL profiles.
# Profile-specific overrides: application-dev, application-k8s, application-k8s-ha

spring.application.name=api-gateway
server.port=8080

# ============================================
#        ACTUATOR / PROMETHEUS
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.prometheus.metrics.export.enabled=true
management.endpoint.gateway.access=read_only

management.endpoint.health.group.liveness.include=livenessState,diskSpace
management.endpoint.health.group.readiness.include=readinessState,diskSpace

# Health indicators
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true

# ============================================
#        INFO ENDPOINT
# ============================================
management.info.env.enabled=true
management.info.build.enabled=true
management.info.java.enabled=false
management.info.os.enabled=false

info.app.name=${spring.application.name}
info.app.description=Spring Cloud Gateway — API entry point for Conecta Seguros microservices

# ============================================
#        MICROMETER TAGS
# ============================================
management.metrics.tags.application=${spring.application.name}
management.metrics.enable.jvm=true
management.metrics.enable.system=true
management.metrics.enable.process=true
management.metrics.enable.http=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ============================================
#        COMPRESSION (Netty response compression)
# ============================================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# ============================================
#        NETTY TUNING
# ============================================
server.http2.enabled=true
server.netty.connection-timeout=5000
server.netty.idle-timeout=60s
server.netty.max-http-request-header-size=32KB

# ============================================
#        FORWARD HEADERS
# ============================================
server.forward-headers-strategy=framework

# ============================================
#        GATEWAY GLOBAL HTTP CLIENT
# ============================================
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=5000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=30s

# Connection pool
spring.cloud.gateway.server.webflux.httpclient.pool.type=ELASTIC
spring.cloud.gateway.server.webflux.httpclient.pool.max-connections=500
spring.cloud.gateway.server.webflux.httpclient.pool.max-idle-time=20s
spring.cloud.gateway.server.webflux.httpclient.pool.max-life-time=60s
spring.cloud.gateway.server.webflux.httpclient.pool.eviction-interval=30s

# WebSocket
spring.cloud.gateway.server.webflux.httpclient.websocket.max-frame-payload-length=10485760

# SSL downstream
spring.cloud.gateway.server.webflux.httpclient.ssl.use-insecure-trust-manager=false
spring.cloud.gateway.server.webflux.httpclient.ssl.handshake-timeout=10s
spring.cloud.gateway.server.webflux.httpclient.ssl.close-notify-flush-timeout=3s
spring.cloud.gateway.server.webflux.httpclient.ssl.close-notify-read-timeout=3s

# ============================================
#        GATEWAY DEFAULT FILTERS
# ============================================
spring.cloud.gateway.server.webflux.default-filters[0]=SaveSession
spring.cloud.gateway.server.webflux.default-filters[1]=TokenRelay
spring.cloud.gateway.server.webflux.default-filters[2]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# Global retry GET only, exponential backoff
spring.cloud.gateway.server.webflux.default-filters[3]=Retry
spring.cloud.gateway.server.webflux.default-filters[3].args.retries=2
spring.cloud.gateway.server.webflux.default-filters[3].args.statuses=BAD_GATEWAY,SERVICE_UNAVAILABLE
spring.cloud.gateway.server.webflux.default-filters[3].args.methods=GET
spring.cloud.gateway.server.webflux.default-filters[3].args.backoff.firstBackoff=100ms
spring.cloud.gateway.server.webflux.default-filters[3].args.backoff.maxBackoff=1000ms
spring.cloud.gateway.server.webflux.default-filters[3].args.backoff.factor=2
spring.cloud.gateway.server.webflux.default-filters[3].args.backoff.basedOnPreviousValue=true

# Request size limit — enforced by RequestSizeGlobalFilter (config/), must be
# >= news-service max-request-size (50MB). NOT the RequestSize gateway filter
# shortcut: its indexed args[n].maxSize DataSize binding silently falls back to
# the library default of 5MB instead of failing loudly (see RequestSizeGlobalFilter
# javadoc for the confirmed root cause).
app.gateway.max-request-size=55MB

# ============================================
#        CIRCUIT BREAKER RESILIENCE4J DEFAULTS
# ============================================
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10
resilience4j.circuitbreaker.configs.default.recordExceptions=java.io.IOException,java.util.concurrent.TimeoutException,org.springframework.web.client.ResourceAccessException

# Time limiter
resilience4j.timelimiter.configs.default.timeoutDuration=30s
resilience4j.timelimiter.configs.default.cancelRunningFuture=true

# ============================================
#        RATE LIMITER DEFAULTS
# ============================================
spring.cloud.gateway.filter.request-rate-limiter.deny-empty-key=true
spring.cloud.gateway.filter.request-rate-limiter.empty-key-status-code=429

# ============================================
#        ERROR HANDLING
# ============================================
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never

# ============================================
#        GRACEFUL SHUTDOWN
# ============================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
