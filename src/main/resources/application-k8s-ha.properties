# ============================================
#        API GATEWAY K8S PRODUCTION (HA)
# ============================================
# Inherits from application.properties (base).
# Optimized for production with HA Eureka peers.

server.port=8080

# ============================================
#        EUREKA CLIENT (HA peers)
# ============================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://conecta-eureka-peer1:8761/eureka/,http://conecta-eureka-peer2:8762/eureka/}
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME}:${server.port}
eureka.instance.hostname=${GATEWAY_HOSTNAME:${HOSTNAME}}
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port-enabled=true
eureka.instance.secure-port-enabled=false

# Status/health URLs for Eureka dashboard
eureka.instance.status-page-url=https://${eureka.instance.hostname}/actuator/info
eureka.instance.health-check-url=https://${eureka.instance.hostname}/actuator/health

# Lease timing production conservative
eureka.instance.lease-renewal-interval-in-seconds=15
eureka.instance.lease-expiration-duration-in-seconds=45
eureka.client.registry-fetch-interval-seconds=15
eureka.client.initial-instance-info-replication-interval-seconds=30
eureka.client.instance-info-replication-interval-seconds=15
eureka.client.healthcheck.enabled=true

# Metadata
eureka.instance.metadata-map.zone=${EUREKA_ZONE:default}
eureka.instance.metadata-map.version=${info.app.version:1.0.0}

# Load balancer cache production optimized
spring.cloud.loadbalancer.cache.enabled=true
spring.cloud.loadbalancer.cache.caffeine.spec=initialCapacity=50,maximumSize=1024,expireAfterWrite=5m

# ============================================
#        GATEWAY ROUTES (with Circuit Breaker + Rate Limiting)
# ============================================

# --- Clients Service ---
spring.cloud.gateway.server.webflux.routes[0].id=clients-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://clients-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/clients/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=clients-cb
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback/service-unavailable
spring.cloud.gateway.server.webflux.routes[0].filters[1]=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.redis-rate-limiter.replenishRate=50
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.redis-rate-limiter.burstCapacity=100
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.redis-rate-limiter.requestedTokens=1

# --- News Service ---
spring.cloud.gateway.server.webflux.routes[1].id=news-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://news-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/news/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=news-cb
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/service-unavailable
spring.cloud.gateway.server.webflux.routes[1].filters[1]=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.redis-rate-limiter.replenishRate=20
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.redis-rate-limiter.burstCapacity=40
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.redis-rate-limiter.requestedTokens=1

# --- Payments Service ---
spring.cloud.gateway.server.webflux.routes[2].id=payments-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://payments-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/payments/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.name=payments-cb
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.fallbackUri=forward:/fallback/service-unavailable
spring.cloud.gateway.server.webflux.routes[2].filters[1]=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.redis-rate-limiter.replenishRate=30
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.redis-rate-limiter.burstCapacity=60
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.redis-rate-limiter.requestedTokens=1

# --- Products Service ---
spring.cloud.gateway.server.webflux.routes[3].id=products-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://products-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/products/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.name=products-cb
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.fallbackUri=forward:/fallback/service-unavailable
spring.cloud.gateway.server.webflux.routes[3].filters[1]=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[3].filters[1].args.redis-rate-limiter.replenishRate=50
spring.cloud.gateway.server.webflux.routes[3].filters[1].args.redis-rate-limiter.burstCapacity=100
spring.cloud.gateway.server.webflux.routes[3].filters[1].args.redis-rate-limiter.requestedTokens=1

# --- Discovery Server Web UI ---
spring.cloud.gateway.server.webflux.routes[4].id=discovery-server
spring.cloud.gateway.server.webflux.routes[4].uri=http://conecta-eureka-peer1:8761
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/eureka/web
spring.cloud.gateway.server.webflux.routes[4].filters[0]=SetPath=/

# --- Discovery Server Static Resources ---
spring.cloud.gateway.server.webflux.routes[5].id=discovery-server-static
spring.cloud.gateway.server.webflux.routes[5].uri=http://conecta-eureka-peer1:8761
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/eureka/**

# ============================================
#        SECURITY OAuth2 (Keycloak production)
# ============================================
spring.security.oauth2.client.provider.keycloak.authorization-uri=${KEYCLOAK_EXTERNAL_URI}/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_INTERNAL_URI}/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=${KEYCLOAK_INTERNAL_URI}/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${KEYCLOAK_INTERNAL_URI}/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri=${GATEWAY_REDIRECT_URI:https://api.caicedoseguros.com/login/oauth2/code/keycloak}
spring.security.oauth2.client.registration.keycloak.client-name=API Gateway

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_INTERNAL_URI}/protocol/openid-connect/certs

# ============================================
#        CORS (production explicit origins)
# ============================================
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://dashboard.caicedoseguros.com}
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${ALLOWED_ORIGINS:https://dashboard.caicedoseguros.com}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=Authorization,Content-Type,Content-Disposition,X-Total-Count,X-Page-Number,X-Page-Size
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600

# ============================================
#        REDIS (K8s service name)
# ============================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=4
spring.data.redis.lettuce.pool.max-wait=2000ms
spring.data.redis.lettuce.shutdown-timeout=200ms

# ============================================
#        LOGGING (production minimal)
# ============================================
logging.level.root=WARN
logging.level.conectaseguros.co.api.gateway=INFO
logging.level.org.springframework.cloud.gateway=WARN
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.oauth2=WARN
logging.level.reactor.netty.http.client=WARN
logging.level.io.github.resilience4j=WARN
