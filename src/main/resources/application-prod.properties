# =============================================================================
# API GATEWAY - CONFIGURACIÓN BASE DE PRODUCCIÓN
# =============================================================================
# Versión: 1.0.0
# Stack: Java 25, Spring Boot 3.5.6, Spring Cloud Gateway
# =============================================================================

# -----------------------------------------------------------------------------
# APLICACIÓN BASE
# -----------------------------------------------------------------------------
spring.application.name=api-gateway
server.address=0.0.0.0
server.port=8080

# Desactivar banner para reducir logs
spring.main.banner-mode=off
spring.output.ansi.enabled=DETECT

# -----------------------------------------------------------------------------
# EUREKA CLIENT - DISCOVERY SERVICE
# -----------------------------------------------------------------------------
# URL del Discovery Server (usar variable de entorno en producción)
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}


# Configuración de registro y heartbeat
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=30
eureka.client.eureka-connection-idle-timeout-seconds=60
eureka.client.disable-delta=false
eureka.client.initial-instance-info-replication-interval-seconds=40

# Instance configuration
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:${random.value}}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${GATEWAY_HOSTNAME:localhost}
eureka.instance.non-secure-port-enabled=true
eureka.instance.non-secure-port=${server.port}
eureka.instance.secure-port-enabled=false

# Health check
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# Metadata para mejor observabilidad
eureka.instance.metadata-map.zone=production
eureka.instance.metadata-map.version=${APP_VERSION:1.0.0}
eureka.instance.metadata-map.environment=prod
eureka.instance.metadata-map.deployment-timestamp=${DEPLOYMENT_TIMESTAMP:unknown}

# -----------------------------------------------------------------------------
# SPRING CLOUD GATEWAY - CONFIGURACIÓN PRINCIPAL
# -----------------------------------------------------------------------------
spring.cloud.gateway.server.webflux.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Configuración de filtros globales predeterminados
spring.cloud.gateway.server.webflux.default-filters[0]=RemoveRequestHeader=Cookie
spring.cloud.gateway.server.webflux.default-filters[1]=RemoveRequestHeader=Set-Cookie
spring.cloud.gateway.server.webflux.default-filters[2]=AddResponseHeader=X-Gateway-Version,1.0.0
spring.cloud.gateway.server.webflux.default-filters[3]=AddResponseHeader=X-Frame-Options,DENY
spring.cloud.gateway.server.webflux.default-filters[4]=AddResponseHeader=X-Content-Type-Options,nosniff
spring.cloud.gateway.server.webflux.default-filters[5]=AddResponseHeader=X-XSS-Protection,1; mode=block
spring.cloud.gateway.server.webflux.default-filters[6]=AddResponseHeader=Strict-Transport-Security,max-age=31536000; includeSubDomains
spring.cloud.gateway.server.webflux.default-filters[7]=AddResponseHeader=Content-Security-Policy,default-src 'self'
spring.cloud.gateway.server.webflux.default-filters[8]=AddResponseHeader=Referrer-Policy,strict-origin-when-cross-origin
spring.cloud.gateway.server.webflux.default-filters[9]=AddResponseHeader=Permissions-Policy,geolocation=()

# -----------------------------------------------------------------------------
# TIMEOUTS Y CIRCUIT BREAKER
# -----------------------------------------------------------------------------
# Global timeouts
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=10000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=60s
# Connection pool configuration
spring.cloud.gateway.server.webflux.httpclient.pool.type=ELASTIC
spring.cloud.gateway.server.webflux.httpclient.pool.max-connections=1000
spring.cloud.gateway.server.webflux.httpclient.pool.max-idle-time=120s
spring.cloud.gateway.server.webflux.httpclient.pool.max-life-time=1200s
spring.cloud.gateway.server.webflux.httpclient.pool.acquire-timeout=45

# WebSocket configuration
spring.cloud.gateway.server.webflux.httpclient.websocket.max-frame-payload-length=65536

# SSL/TLS Configuration
spring.cloud.gateway.server.webflux.httpclient.ssl.useInsecureTrustManager=false
spring.cloud.gateway.server.webflux.httpclient.ssl.handshake-timeout=10s
spring.cloud.gateway.server.webflux.httpclient.ssl.close-notify-flush-timeout=3s
spring.cloud.gateway.server.webflux.httpclient.ssl.close-notify-read-timeout=0s

# Compression
spring.cloud.gateway.server.webflux.httpclient.compression=true

# -----------------------------------------------------------------------------
# LOAD BALANCER CONFIGURATION
# -----------------------------------------------------------------------------
spring.cloud.loadbalancer.enabled=true
spring.cloud.loadbalancer.ribbon.enabled=false
spring.cloud.loadbalancer.cache.enabled=true
spring.cloud.loadbalancer.cache.ttl=60s
spring.cloud.loadbalancer.cache.capacity=512
spring.cloud.loadbalancer.health-check.initial-delay=0s
spring.cloud.loadbalancer.health-check.interval=30s

# Configuración de Caffeine cache
spring.cloud.loadbalancer.cache.caffeine.spec=initialCapacity=50,maximumSize=500,expireAfterWrite=60s

# -----------------------------------------------------------------------------
# RUTAS DE MICROSERVICIOS
# -----------------------------------------------------------------------------

# Route 1: Batch Processor Service
spring.cloud.gateway.server.webflux.routes[0].id=batch-processor-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://batch-processor-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/batch/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=0
spring.cloud.gateway.server.webflux.routes[0].filters[1]=CircuitBreaker=batch-processor-cb
spring.cloud.gateway.server.webflux.routes[0].metadata.response-timeout=60000
spring.cloud.gateway.server.webflux.routes[0].metadata.connect-timeout=5000

# Route 2: Clients Service
spring.cloud.gateway.server.webflux.routes[1].id=clients-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://clients-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/clients/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=0
spring.cloud.gateway.server.webflux.routes[1].filters[1]=CircuitBreaker=clients-cb
spring.cloud.gateway.server.webflux.routes[1].metadata.response-timeout=30000
spring.cloud.gateway.server.webflux.routes[1].metadata.connect-timeout=5000

# Route 3: News Service
spring.cloud.gateway.server.webflux.routes[2].id=news-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://news-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/news/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=0
spring.cloud.gateway.server.webflux.routes[2].filters[1]=CircuitBreaker=news-cb
spring.cloud.gateway.server.webflux.routes[2].metadata.response-timeout=15000
spring.cloud.gateway.server.webflux.routes[2].metadata.connect-timeout=5000

# Route 4: Payments Service
spring.cloud.gateway.server.webflux.routes[3].id=payments-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://payments-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/payments/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=0
spring.cloud.gateway.server.webflux.routes[3].filters[1]=CircuitBreaker=payments-cb
spring.cloud.gateway.server.webflux.routes[3].metadata.response-timeout=45000
spring.cloud.gateway.server.webflux.routes[3].metadata.connect-timeout=5000

# Route 5: Products Service
spring.cloud.gateway.server.webflux.routes[4].id=products-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://products-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/products/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=0
spring.cloud.gateway.server.webflux.routes[4].filters[1]=CircuitBreaker=products-cb
spring.cloud.gateway.server.webflux.routes[4].metadata.response-timeout=20000
spring.cloud.gateway.server.webflux.routes[4].metadata.connect-timeout=5000

# Route 6: Reports Service
spring.cloud.gateway.server.webflux.routes[5].id=reports-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://reports-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/reports/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=0
spring.cloud.gateway.server.webflux.routes[5].filters[1]=CircuitBreaker=reports-cb
spring.cloud.gateway.server.webflux.routes[5].metadata.response-timeout=90000
spring.cloud.gateway.server.webflux.routes[5].metadata.connect-timeout=5000

# Route 7: Discovery Server Web UI
spring.cloud.gateway.server.webflux.routes[6].id=discovery-server-web
spring.cloud.gateway.server.webflux.routes[6]=${EUREKA_WEB_URL}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/eureka/web
spring.cloud.gateway.server.webflux.routes[6].filters[0]=SetPath=/

# Route 8: Discovery Server Static Resources
spring.cloud.gateway.server.webflux.routes[7].id=discovery-server-static
spring.cloud.gateway.server.webflux.routes[7]=${EUREKA_WEB_URL}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/eureka/**

# Route 9: Actuator Health Check (público)
spring.cloud.gateway.server.webflux.routes[8].id=actuator-health
spring.cloud.gateway.server.webflux.routes[8].uri=http://localhost:${server.port}
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/actuator/health
spring.cloud.gateway.server.webflux.routes[8].predicates[1]=Method=GET

# -----------------------------------------------------------------------------
# RESILIENCE4J - CIRCUIT BREAKER
# -----------------------------------------------------------------------------
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=20
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=10
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=120s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=60
resilience4j.circuitbreaker.configs.default.slowCallRateThreshold=100
resilience4j.circuitbreaker.configs.default.slowCallDurationThreshold=10s
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10

# Circuit breakers específicos
resilience4j.circuitbreaker.instances.batch-processor-cb.baseConfig=default
resilience4j.circuitbreaker.instances.clients-cb.baseConfig=default
resilience4j.circuitbreaker.instances.news-cb.baseConfig=default
resilience4j.circuitbreaker.instances.payments-cb.baseConfig=default
resilience4j.circuitbreaker.instances.products-cb.baseConfig=default
resilience4j.circuitbreaker.instances.reports-cb.baseConfig=default

# -----------------------------------------------------------------------------
# RESILIENCE4J - RETRY
# -----------------------------------------------------------------------------
resilience4j.retry.configs.default.maxAttempts=3
resilience4j.retry.configs.default.waitDuration=500ms
resilience4j.retry.configs.default.retryExceptions=java.io.IOException,java.util.concurrent.TimeoutException
resilience4j.retry.configs.default.ignoreExceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException

# -----------------------------------------------------------------------------
# RESILIENCE4J - RATE LIMITER
# -----------------------------------------------------------------------------
resilience4j.ratelimiter.configs.default.registerHealthIndicator=true
resilience4j.ratelimiter.configs.default.limitForPeriod=100
resilience4j.ratelimiter.configs.default.limitRefreshPeriod=1s
resilience4j.ratelimiter.configs.default.timeoutDuration=0s
resilience4j.ratelimiter.configs.default.eventConsumerBufferSize=100

resilience4j.ratelimiter.instances.api-gateway-limiter.baseConfig=default
resilience4j.ratelimiter.instances.api-gateway-limiter.limitForPeriod=${RATE_LIMIT_REQUESTS:5000}
resilience4j.ratelimiter.instances.api-gateway-limiter.limitRefreshPeriod=1s

# -----------------------------------------------------------------------------
# OAUTH2 Y SEGURIDAD
# -----------------------------------------------------------------------------
# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/certs

# OAuth2 Client (Keycloak)
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/keycloak
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

# -----------------------------------------------------------------------------
# CORS CONFIGURATION
# -----------------------------------------------------------------------------
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With,X-XSRF-TOKEN
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=Authorization,Content-Type,Content-Disposition,X-Total-Count,X-Page-Number
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600

# -----------------------------------------------------------------------------
# ACTUATOR - HEALTH & MONITORING
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoints.web.base-path=/actuator
management.endpoint.health.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.info.enabled=true
management.endpoint.gateway.enabled=false

# Health checks
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true

# Liveness y Readiness probes (Kubernetes ready)
management.endpoint.health.group.liveness.include=ping
management.endpoint.health.group.readiness.include=ping,diskSpace,db

# Info endpoint
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

info.app.name=${spring.application.name}
info.app.description=API Gateway para arquitectura de microservicios
info.app.version=${APP_VERSION:1.0.0}
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=${java.version}

# Metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# -----------------------------------------------------------------------------
# LOGGING CONFIGURATION
# -----------------------------------------------------------------------------
logging.level.root=WARN
logging.level.com.netflix.discovery=WARN
logging.level.com.netflix.eureka=WARN
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.reactor.netty=WARN
logging.level.io.github.resilience4j=INFO

# Patrón de logging estructurado
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Archivo de logs (comentado para Docker, usa stdout)
#logging.file.name=/var/log/api-gateway/application.log
#logging.file.max-size=10MB
#logging.file.max-history=30

# -----------------------------------------------------------------------------
# WEBFLUX & REACTOR CONFIGURATION
# -----------------------------------------------------------------------------
spring.webflux.base-path=/
spring.http.codecs.max-in-memory-size=20MB

# Reactor Netty configuration
reactor.netty.ioWorkerCount=${IO_WORKER_COUNT:8}
reactor.netty.ioSelectCount=${IO_SELECT_COUNT:4}

# -----------------------------------------------------------------------------
# SPRING BOOT DEV TOOLS (Desactivado en producción)
# -----------------------------------------------------------------------------
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# -----------------------------------------------------------------------------
# COMPRESSION
# -----------------------------------------------------------------------------
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# -----------------------------------------------------------------------------
# GRACEFUL SHUTDOWN
# -----------------------------------------------------------------------------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s


# -----------------------------------------------------------------------------
# ERROR HANDLING
# -----------------------------------------------------------------------------
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
