# ============================================
# APPLICATION IDENTIFICATION
# ============================================
spring.application.name=api-gateway
server.address=0.0.0.0
server.port=${SERVER_PORT}

# ============================================
# SPRING BOOT CONFIGURATION
# ============================================
# Disable LiveReload in production
spring.devtools.livereload.enabled=false

# Load Balancer Caching (Optimized for production)
spring.cloud.loadbalancer.cache.enabled=true
spring.cloud.loadbalancer.cache.caffeine.spec=initialCapacity=50,maximumSize=1024,expireAfterWrite=5m

# ============================================
# EUREKA CLIENT CONFIGURATION
# ============================================
# Discovery Server URL (Production)
eureka.client.service-url.default-zone=${EUREKA_SERVER_URL}

# Instance Configuration
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:${random.value}}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${GATEWAY_HOSTNAME}
eureka.instance.non-secure-port-enabled=true
eureka.instance.secure-port-enabled=false
eureka.instance.secure-port=${server.port}
eureka.instance.status-page-url=https://${eureka.instance.hostname}:${server.port}/actuator/info
eureka.instance.health-check-url=https://${eureka.instance.hostname}:${server.port}/actuator/health

# Lease Configuration (Production optimized)
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Client Fetch Registry Configuration
eureka.client.registry-fetch-interval-seconds=10
eureka.client.initial-instance-info-replication-interval-seconds=20
eureka.client.instance-info-replication-interval-seconds=10

# Enable healthcheck
eureka.client.healthcheck.enabled=true

# ============================================
# GATEWAY ROUTES CONFIGURATION
# ============================================

# --- Batch Processor Service ---
spring.cloud.gateway.server.webflux.routes[0].id=batch-processor-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://batch-processor-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/batch/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=0
spring.cloud.gateway.server.webflux.routes[0].filters[1]=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.name=batch-processor-cb
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.fallbackUri=forward:/fallback/batch-processor
spring.cloud.gateway.server.webflux.routes[0].filters[2]=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[2].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.server.webflux.routes[0].filters[2].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.server.webflux.routes[0].filters[2].args.redis-rate-limiter.requestedTokens=1

# --- Clients Service ---
spring.cloud.gateway.server.webflux.routes[1].id=clients-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://clients-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/clients/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=0
spring.cloud.gateway.server.webflux.routes[1].filters[1]=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.name=clients-cb
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.fallbackUri=forward:/fallback/clients
spring.cloud.gateway.server.webflux.routes[1].filters[2]=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[1].filters[2].args.redis-rate-limiter.replenishRate=50
spring.cloud.gateway.server.webflux.routes[1].filters[2].args.redis-rate-limiter.burstCapacity=100
spring.cloud.gateway.server.webflux.routes[1].filters[2].args.redis-rate-limiter.requestedTokens=1

# --- News Service ---
spring.cloud.gateway.server.webflux.routes[2].id=news-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://news-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/news/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=0
spring.cloud.gateway.server.webflux.routes[2].filters[1]=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.name=news-cb
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.fallbackUri=forward:/fallback/news
spring.cloud.gateway.server.webflux.routes[2].filters[2]=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[2].filters[2].args.redis-rate-limiter.replenishRate=20
spring.cloud.gateway.server.webflux.routes[2].filters[2].args.redis-rate-limiter.burstCapacity=40
spring.cloud.gateway.server.webflux.routes[2].filters[2].args.redis-rate-limiter.requestedTokens=1

# --- Payments Service ---
spring.cloud.gateway.server.webflux.routes[3].id=payments-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://payments-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/payments/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=0
spring.cloud.gateway.server.webflux.routes[3].filters[1]=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[3].filters[1].args.name=payments-cb
spring.cloud.gateway.server.webflux.routes[3].filters[1].args.fallbackUri=forward:/fallback/payments
spring.cloud.gateway.server.webflux.routes[3].filters[2]=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[3].filters[2].args.redis-rate-limiter.replenishRate=30
spring.cloud.gateway.server.webflux.routes[3].filters[2].args.redis-rate-limiter.burstCapacity=60
spring.cloud.gateway.server.webflux.routes[3].filters[2].args.redis-rate-limiter.requestedTokens=1

# --- Products Service ---
spring.cloud.gateway.server.webflux.routes[4].id=products-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://products-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/products/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=0
spring.cloud.gateway.server.webflux.routes[4].filters[1]=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[4].filters[1].args.name=products-cb
spring.cloud.gateway.server.webflux.routes[4].filters[1].args.fallbackUri=forward:/fallback/products
spring.cloud.gateway.server.webflux.routes[4].filters[2]=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[4].filters[2].args.redis-rate-limiter.replenishRate=50
spring.cloud.gateway.server.webflux.routes[4].filters[2].args.redis-rate-limiter.burstCapacity=100
spring.cloud.gateway.server.webflux.routes[4].filters[2].args.redis-rate-limiter.requestedTokens=1

# --- Reports Service ---
spring.cloud.gateway.server.webflux.routes[5].id=reports-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://reports-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/reports/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=0
spring.cloud.gateway.server.webflux.routes[5].filters[1]=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[5].filters[1].args.name=reports-cb
spring.cloud.gateway.server.webflux.routes[5].filters[1].args.fallbackUri=forward:/fallback/reports
spring.cloud.gateway.server.webflux.routes[5].filters[2]=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[5].filters[2].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.server.webflux.routes[5].filters[2].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.server.webflux.routes[5].filters[2].args.redis-rate-limiter.requestedTokens=1

# --- Discovery Server Web UI ---
spring.cloud.gateway.server.webflux.routes[6].id=discovery-server
spring.cloud.gateway.server.webflux.routes[6].uri=${EUREKA_SERVER_URL}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/eureka/web
spring.cloud.gateway.server.webflux.routes[6].filters[0]=SetPath=/

# --- Discovery Server Static Resources ---
spring.cloud.gateway.server.webflux.routes[7].id=discovery-server-static
spring.cloud.gateway.server.webflux.routes[7].uri=${EUREKA_SERVER_URL}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/eureka/**

# ============================================
# GLOBAL FILTERS
# ============================================
spring.cloud.gateway.server.webflux.default-filters[0]=SaveSession
spring.cloud.gateway.server.webflux.default-filters[1]=TokenRelay
spring.cloud.gateway.server.webflux.default-filters[2]=RemoveRequestHeader=Cookie
spring.cloud.gateway.server.webflux.default-filters[3]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# Global Retry Configuration (Conservative in production)
spring.cloud.gateway.server.webflux.default-filters[4]=Retry
spring.cloud.gateway.server.webflux.default-filters[4].args.retries=2
spring.cloud.gateway.server.webflux.default-filters[4].args.statuses=BAD_GATEWAY,SERVICE_UNAVAILABLE
spring.cloud.gateway.server.webflux.default-filters[4].args.methods=GET
spring.cloud.gateway.server.webflux.default-filters[4].args.backoff.firstBackoff=100ms
spring.cloud.gateway.server.webflux.default-filters[4].args.backoff.maxBackoff=1000ms
spring.cloud.gateway.server.webflux.default-filters[4].args.backoff.factor=2
spring.cloud.gateway.server.webflux.default-filters[4].args.backoff.basedOnPreviousValue=true

# Request Size Limit (10MB for file uploads in news-service)
spring.cloud.gateway.server.webflux.default-filters[5]=RequestSize
spring.cloud.gateway.server.webflux.default-filters[5].args.maxSize=10MB

# ============================================
# RESILIENCE & TIMEOUT CONFIGURATION
# ============================================
# Global HTTP Client Timeouts
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=5000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=30s

# Connection Pool Configuration
spring.cloud.gateway.server.webflux.httpclient.pool.type=ELASTIC
spring.cloud.gateway.server.webflux.httpclient.pool.max-connections=500
spring.cloud.gateway.server.webflux.httpclient.pool.max-idle-time=20s
spring.cloud.gateway.server.webflux.httpclient.pool.max-life-time=60s
spring.cloud.gateway.server.webflux.httpclient.pool.eviction-interval=30s

# WebSocket Configuration (if needed)
spring.cloud.gateway.server.webflux.httpclient.websocket.max-frame-payload-length=10485760

# SSL Configuration
spring.cloud.gateway.server.webflux.httpclient.ssl.use-insecure-trust-manager=false
spring.cloud.gateway.server.webflux.httpclient.ssl.handshake-timeout=10s
spring.cloud.gateway.server.webflux.httpclient.ssl.close-notify-flush-timeout=3s
spring.cloud.gateway.server.webflux.httpclient.ssl.close-notify-read-timeout=3s

# ============================================
# CIRCUIT BREAKER CONFIGURATION (Resilience4j)
# ============================================
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10
resilience4j.circuitbreaker.configs.default.recordExceptions=java.io.IOException,java.util.concurrent.TimeoutException,org.springframework.web.client.ResourceAccessException

# ============================================
# SECURITY CONFIGURATION
# ============================================
# OAuth2 Resource Server (JWT Validation)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/certs

# Keycloak OAuth2 Client
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/keycloak

# ============================================
# CORS CONFIGURATION (Production)
# ============================================
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${ALLOWED_ORIGINS}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=Authorization,Content-Type,Content-Disposition,X-Total-Count,X-Page-Number,X-Page-Size
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600

# ============================================
# REDIS CONFIGURATION (Rate Limiting & Session)
# ============================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=-1ms
spring.data.redis.lettuce.shutdown-timeout=100ms

# ============================================
# ACTUATOR & MONITORING
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.endpoint.gateway.access=read_only

# Health Check Configuration
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true

# Metrics Configuration
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=production

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.com.conectaseguros.apigateway=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.reactive.function.client=INFO
logging.level.reactor.netty.http.client=INFO

# Logging Pattern (Structured logging for production)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# PERFORMANCE & OPTIMIZATION
# ============================================
# WebFlux Configuration
spring.webflux.base-path=/
server.http2.enabled=true

# Netty Server Configuration
server.netty.connection-timeout=5000
server.netty.idle-timeout=60s

# Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml

# ============================================
# ADDITIONAL PRODUCTION SETTINGS
# ============================================
# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Request/Response Body Caching (for logging)
spring.cloud.gateway.filter.request-rate-limiter.deny-empty-key=true
spring.cloud.gateway.filter.request-rate-limiter.empty-key-status-code=429

# Forward Headers
server.forward-headers-strategy=framework

# Error Handling
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never