# ============================================
#        API GATEWAY LOCAL DEVELOPMENT
# ============================================

server.port=8080

# ============================================
#        EUREKA CLIENT (localhost)
# ============================================
eureka.client.service-url.defaultZone=http://eureka:password@localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# Fast discovery in dev
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5

# Disable load balancer cache in dev avoids stale instances after service restarts
spring.cloud.loadbalancer.cache.enabled=false

# ============================================
#        GATEWAY ROUTES
# ============================================

# --- Clients Service ---
spring.cloud.gateway.server.webflux.routes[0].id=clients-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://clients-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/clients/**

# --- News Service ---
spring.cloud.gateway.server.webflux.routes[1].id=news-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://news-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/news/**

# --- Payments Service ---
spring.cloud.gateway.server.webflux.routes[2].id=payments-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://payments-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/payments/**

# --- Products Service ---
spring.cloud.gateway.server.webflux.routes[3].id=products-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://products-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/products/**

# --- Discovery Server Web UI ---
spring.cloud.gateway.server.webflux.routes[4].id=discovery-server
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8761
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/eureka/web
spring.cloud.gateway.server.webflux.routes[4].filters[0]=SetPath=/

# --- Discovery Server Static Resources ---
spring.cloud.gateway.server.webflux.routes[5].id=discovery-server-static
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8761
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/eureka/**

# ============================================
#        SECURITY OAuth2 (Keycloak local)
# ============================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_OAUTH2_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_OAUTH2_ISSUER_URI}/protocol/openid-connect/certs

spring.security.oauth2.client.provider.keycloak.issuer-uri=${SPRING_OAUTH2_ISSUER_URI}
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.client-id=${SPRING_OAUTH2_CLIENT_ID}
spring.security.oauth2.client.registration.keycloak.client-secret=${SPRING_OAUTH2_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/keycloak

# ============================================
#        CORS (dev localhost only)
# ============================================
app.cors.allowed-origins=http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With,Access-Control-Request-Method,Access-Control-Request-Headers
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=Authorization,Content-Type,Content-Disposition,X-Total-Count,X-Page-Number,X-Page-Size
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600

# ============================================
#        REDIS (local)
# ============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=2000ms

# ============================================
#        INFO CONTRIBUTORS (verbose in dev)
# ============================================
management.info.java.enabled=true
management.info.os.enabled=true

# ============================================
#        LOGGING (verbose in dev)
# ============================================
logging.level.root=INFO
logging.level.conectaseguros.co.api.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.reactor.netty.http.client=DEBUG
logging.level.io.github.resilience4j=DEBUG
